<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>Zivith</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: transparent;
        color: #a1a1aa;
        font-family: 'Segoe UI', system-ui, sans-serif;
        overflow: hidden;
        user-select: none;
      }
      .panel {
        box-sizing: border-box;
        height: calc(100% - 16px);
        margin: 8px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 22px;
        border-radius: 28px;
        background: #000;
      }
      .lockup {
        width: min(460px, 82%);
        height: auto;
      }
      p {
        margin: 0;
        font-size: 13px;
        letter-spacing: 0.04em;
      }
    </style>
  </head>
  <body>
    <div class="panel">
      <img class="lockup" src="logo.png" alt="ZIVITH" />
      <p id="status">正在启动…</p>
    </div>
  </body>
</html>
