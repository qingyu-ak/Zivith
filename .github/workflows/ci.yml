name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, typecheck, test, and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: true
      NODE_ENV: test
      DATABASE_URL: postgresql://zivith:zivith_dev_only@localhost:5432/zivith_test
      REDIS_URL: redis://localhost:6379/1
      S3_ENDPOINT: http://localhost:9000
      S3_REGION: us-east-1
      S3_BUCKET: zivith-test-media
      S3_ACCESS_KEY: zivith
      S3_SECRET_KEY: zivith_minio_dev_only
      S3_FORCE_PATH_STYLE: 'true'
      JWT_SECRET: ci_only_secret_at_least_32_chars_long
      POSTGRES_DB: zivith_test

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up pnpm
        uses: pnpm/action-setup@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Start test infrastructure
        run: |
          docker compose up -d --wait postgres redis minio
          docker compose run --rm minio-init

      - name: Apply database migrations
        run: pnpm --filter @zivith/database exec prisma migrate deploy

      - name: Check formatting
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Stop test infrastructure
        if: always()
        run: docker compose down --volumes
